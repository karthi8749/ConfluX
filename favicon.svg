<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ConfluX Stock Scanner App Icon - Bold & High Visibility</title>
  <defs>
    <!-- Rich vibrant background gradient -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18bcf5"/>
      <stop offset="45%" stop-color="#0875f5"/>
      <stop offset="100%" stop-color="#072bee"/>
    </linearGradient>
    <!-- Ultra-radiant Neon Bullish Candlesticks -->
    <linearGradient id="candle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7affc3"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <!-- Pure High-Contrast White Glass Frame -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#02144d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Tile Background (Standard iOS/Android Squircle) -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>

  <!-- Scaled up & Bold Core Graphics (Filtered with subtle shadow for depth) -->
  <g filter="url(#subtle-shadow)">

    <!-- 1. Stock Scanning Viewfinder Brackets (Extra Bold: stroke 54px) -->
    <g fill="none" stroke="url(#glass)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top Left Bracket -->
      <path d="M 210 330 V 260 Q 210 210 260 210 H 370"/>
      <!-- Top Right Bracket -->
      <path d="M 814 330 V 260 Q 814 210 764 210 H 654"/>
      <!-- Bottom Left Bracket -->
      <path d="M 210 694 V 764 Q 210 814 260 814 H 370"/>
    </g>

    <!-- 2. Extra Thick Candlesticks (3 Bold Ascending Bars) -->
    <!-- Candle 1: Left Small -->
    <line x1="340" y1="470" x2="340" y2="420" stroke="url(#candle)" stroke-width="22" stroke-linecap="round"/>
    <line x1="340" y1="650" x2="340" y2="700" stroke="url(#candle)" stroke-width="22" stroke-linecap="round"/>
    <rect x="290" y="490" width="100" height="160" rx="14" fill="url(#candle)"/>

    <!-- Candle 2: Middle Medium -->
    <line x1="512" y1="360" x2="512" y2="300" stroke="url(#candle)" stroke-width="24" stroke-linecap="round"/>
    <line x1="512" y1="620" x2="512" y2="670" stroke="url(#candle)" stroke-width="24" stroke-linecap="round"/>
    <rect x="457" y="390" width="110" height="230" rx="14" fill="url(#candle)"/>

    <!-- Candle 3: Right Tall Breakout -->
    <line x1="684" y1="260" x2="684" y2="200" stroke="url(#candle)" stroke-width="24" stroke-linecap="round"/>
    <line x1="684" y1="510" x2="684" y2="560" stroke="url(#candle)" stroke-width="24" stroke-linecap="round"/>
    <rect x="629" y="290" width="110" height="220" rx="14" fill="url(#candle)"/>

    <!-- 3. Extra Bold Magnifying Glass / Scanner Lens -->
    <!-- Lens Ring (Bold 46px stroke, bright white) -->
    <circle cx="635" cy="625" r="105" fill="none" stroke="url(#glass)" stroke-width="46"/>
    <!-- Glass Inner Subtle Highlight -->
    <circle cx="635" cy="625" r="82" fill="#ffffff" fill-opacity="0.12"/>
    <!-- Handle (Extra Thick 50px stroke) -->
    <path d="M 712 702 L 795 785" fill="none" stroke="url(#glass)" stroke-width="50" stroke-linecap="round"/>

  </g>
</svg>
