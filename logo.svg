<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ConfluX Stock Scanner App Icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13B9F4"/>
      <stop offset="0.48" stop-color="#0877F5"/>
      <stop offset="1" stop-color="#092BEE"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#63F6B0"/>
      <stop offset="1" stop-color="#00D982"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>

  <!-- Stock-scanning frame -->
  <g fill="none" stroke="url(#glass)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round">
    <path d="M315 390 V354 Q315 328 342 328 H412"/>
    <path d="M709 328 H682 Q656 328 656 354 V390"/>
    <path d="M315 636 V672 Q315 698 342 698 H412"/>
  </g>

  <!-- Rising candlesticks -->
  <g fill="url(#candle)" stroke="url(#candle)" stroke-linecap="round">
    <!-- First candle -->
    <path d="M404 498 V468 M404 608 V638" fill="none" stroke-width="12"/>
    <rect x="370" y="510" width="68" height="100" rx="7"/>
    <!-- Second candle -->
    <path d="M512 424 V393 M512 582 V612" fill="none" stroke-width="12"/>
    <rect x="478" y="451" width="68" height="131" rx="7"/>
    <!-- Third candle -->
    <path d="M620 351 V321 M620 512 V542" fill="none" stroke-width="12"/>
    <rect x="586" y="385" width="68" height="127" rx="7"/>
  </g>

  <!-- Magnifying glass -->
  <g fill="none" stroke="url(#glass)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="590" cy="581" r="67" stroke-width="25"/>
    <path d="M638 630 L687 679" stroke-width="27"/>
  </g>
</svg>
