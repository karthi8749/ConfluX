name: ConfluX Scanner & Dashboard

on:
  workflow_dispatch: # Manual 1-click trigger from mobile GitHub app or website

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Chartink Scans & Update Dashboard
        run: node main.js

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html cached_data.json cached_candles.json chartink_results.txt watchlists/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ConfluX Scans & Dashboard [skip ci]" && git push)
